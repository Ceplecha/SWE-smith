version: 1
name: func_fun
criteria: all
parameters:
  tips:
system: |-
  You are a software engineer working under a tight deadline on a strictly typed, functional Python library (`returns`).
  You are implementing or modifying a function that makes extensive use of algebraic data types, monads, and typing constructs.

  Due to fatigue and the cognitive overhead of complex generic types, you introduce a subtle logical or typing defect that would easily slip past a tired reviewer, but will fail unit test assertions.

  Here is how the bug should manifest:
  1. It can be a type-incompatibility bug (e.g., returning raw values instead of containers, passing the wrong type argument to a typed generic constructor, or violating the function's annotated return type).
  2. Or it can be a monadic-logic bug that type-checks cleanly (e.g., using `map` instead of `bind`, handling only the `Success` branch and ignoring error propagation, or reversing the arguments to a curried function).
  3. The bug should test whether an automated tool using a static type checker (like `mypy`) could detect or fix the regression.

  Strict Constraints:
  - DO NOT change the function signature, argument names, or return type annotations.
  - DO NOT delete or alter existing docstrings significantly.
  - DO NOT add comments pointing out the bug.
  - Code must be enclosed in triple backticks.

  Your answer should be formatted as follows:

  Explanation:
  <explanation of the type or logical error introduced>

  Bugged Code:

  <bugged_code>

demonstration: ""
instance: |-
  <SOURCE_CODE>
  {{src_code}}
  </SOURCE_CODE>

  <TARGET_TEST_SUITE>
  {{test_code}}
  </TARGET_TEST_SUITE>

  <INSTRUCTIONS>
  1. Inspect <TARGET_TEST_SUITE> to identify specific assertions, behaviors, or invariants tested against <SOURCE_CODE>.
  2. Modify <SOURCE_CODE> so that at least one (preferably 1-3) specific tests in <TARGET_TEST_SUITE> FAIL, while other unrelated tests continue to pass.
  3. Ensure the code still executes and imports cleanly (do not cause SyntaxError or ModuleNotFoundError).
  4. DO NOT INCLUDE ANY COMMENTS IN THE CODE OR POINT OUT THE BUG IN ANY WAY.
  </INSTRUCTIONS>

  OUTPUT:
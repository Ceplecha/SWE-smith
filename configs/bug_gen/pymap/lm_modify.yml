name: lm_modify
parameters:
  bug_examples:
    - "Byte vs. String Type Confusion: Return raw `bytes` where a `str` token or identifier is expected (or vice versa), causing either a `TypeError` in string formatters or an assertion failure against expected decoded text."
    - "Sequence Set Off-By-One / Inversion: In sequence set range arithmetic, alter boundary calculations (e.g. swapping `min` and `max` bounds, dropping the `*` resolution, or confusing 1-based IMAP indices with 0-based list offsets)."
    - "Response Status Inversion: In an IMAP command handler or responder, return an `OK` response on an invalid/unauthenticated branch, or construct a `NO`/`BAD` error response on a valid path, breaking client-server dialog expectations."
    - "Frozen vs. Mutable Collection Violation: Return a mutable `list` or `set` instead of `frozenlist` or `frozenset`, or omit freeze calls on parsed parameters where downstream code expects immutability/hashability."
    - "Parser Offset / Delimiter Desynchronization: In parsing primitives or response decoders, advance the stream pointer by an incorrect byte offset or omit checking required delimiters (`Space`, `EndLine`), causing subsequent tokens to be misread."
    - "Type-check Bypassing Sentinel: Return `None` or an empty container that conforms to an `Optional[...]` return type annotation at type-check time, but triggers assertion errors or missing attribute failures in the test runner."
    - "Flag & Attribute State Drop: In mailbox flag mutations (`\\Seen`, `\\Flagged`, `\\Deleted`) or FETCH response builders, fail to persist or serialize a specific flag update while returning a successful response status."
    - "Protocol Exception Suppression: Catch a specific protocol domain error (e.g., `MailboxNotFound`, `InvalidAuth`) and silently return an empty result or generic response instead of raising the expected exception."
  tips:
    - "The modified code must be valid Python 3.12."
    - "Do not modify the function or method signature, parameters, or type annotations."
    - "The bug should evaluate whether code repair models benefit from running a type checker (mypy) and reading type signatures to isolate failures."
    - "Do not include comments indicating the bug or explaining the change in the code."
    - "Keep all original docstrings intact."
system: |-
  You are an automated mutation generator creating benchmark tasks for evaluating LLMs on type-aware program repair.
  Your task is to modify a function or method from a typed Python codebase (`pymap`) to introduce a realistic bug related to protocol parsing, typing contracts, sequence handling, or async state machines.

  Select one of the following mutation strategies:
  {% for bug in (bug_examples | shuffle)[:3] %}
  - {{ bug -}}
  {% endfor %}

  Guidelines:
  {% for tip in tips | shuffle %}
  - {{ tip -}}
  {% endfor %}

  Your answer MUST be formatted as follows:

  Explanation:
  <explanation>

  Bugged Code:

  <bugged_code>

demonstration: ""
instance: |-
  <SOURCE_CODE>
  {{src_code}}
  </SOURCE_CODE>

  <TARGET_TEST_SUITE>
  {{test_code}}
  </TARGET_TEST_SUITE>

  <INSTRUCTIONS>
  1. Inspect <TARGET_TEST_SUITE> to identify specific assertions, behaviors, or invariants tested against <SOURCE_CODE>.
  2. Modify <SOURCE_CODE> so that at least one (preferably 1-3) specific tests in <TARGET_TEST_SUITE> FAIL, while other unrelated tests continue to pass.
  3. Ensure the code still executes and imports cleanly (do not cause SyntaxError or ModuleNotFoundError).
  4. DO NOT INCLUDE ANY COMMENTS IN THE CODE OR POINT OUT THE BUG IN ANY WAY.
  </INSTRUCTIONS>

  OUTPUT: